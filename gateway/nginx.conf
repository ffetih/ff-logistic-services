# The services side's front door. The edge Service (port 8081, runtime's deploy/platform/edge)
# selects the pods labelled ff-logistic/edge; on this side only the gateway's pods carry it. The
# gateway routes by the first path segment after /api/v1, the area's short name, so a client
# calls the same URLs as on the modulith side.
server {
    listen 8081;

    # Upstreams as variables: nginx then resolves them per request (through the cluster's DNS)
    # instead of once at start, so the gateway starts even before the services exist, and follows
    # them when their addresses change.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    set $warehousing    http://warehousing.ff-logistics.svc.cluster.local:8082;
    set $transportation http://transportation.ff-logistics.svc.cluster.local:8083;
    set $routing        http://routing.ff-logistics.svc.cluster.local:8084;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    location /api/v1/wms/ { proxy_pass $warehousing; }
    location /api/v1/tms/ { proxy_pass $transportation; }
    location /api/v1/geo/ { proxy_pass $routing; }

    # Every service answers /api/v1/me the same way (the chassis); one of them is enough.
    location = /api/v1/me { proxy_pass $transportation; }

    # The chart's probes, and the release group a canary analysis would read. The gateway has no
    # state: if nginx answers, it is live, ready and fit to take traffic.
    location = /actuator/health/liveness  { default_type application/json; return 200 '{"status":"UP"}'; }
    location = /actuator/health/readiness { default_type application/json; return 200 '{"status":"UP"}'; }
    location = /actuator/health/release   { default_type application/json; return 200 '{"status":"UP"}'; }

    location / {
        default_type application/problem+json;
        return 404 '{"status":404,"title":"Not Found","detail":"No area under this path"}';
    }
}
