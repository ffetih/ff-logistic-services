# Test overrides (classpath:/config/application.yml wins over the main file): an in-memory
# database, migrated by the same area migrations as PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:service;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Most tests need no broker: the consumer does not start. DeliveriesFromKafkaTest starts it,
  # with a broker in the test JVM.
  kafka:
    listener:
      auto-startup: false
    # Nor does it create its dead-letter topic on a broker that is not there.
    admin:
      auto-create: false
