# Test overrides (classpath:/config/application.yml wins over the main file): an in-memory
# database, migrated by the same area migrations as PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:service;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Most tests need no broker: events stay inside the service. ShipmentEventsToKafkaTest turns
  # externalization on, with a broker in the test JVM.
  modulith:
    events:
      externalization:
        enabled: false
  # Nor is the consumer started (StopsFromKafkaTest starts it, with a broker in the test JVM), nor
  # its dead-letter topic created on a broker that is not there.
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
# Flow 1: no routing service in the tests unless one names its own (LegDistanceFlowTest). Port 1
# refuses at once, so a road leg gets the estimate without waiting.
ff:
  routing-client:
    base-url: http://127.0.0.1:1
