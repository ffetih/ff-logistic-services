# The chassis (ff-base-app) brings the shared defaults: health groups, probes, virtual threads,
# schema validation. The datasource and token settings are the same in all three services and in
# the modulith: the same database, the same identity service. Repeated per service, as a service's
# configuration is its own.
server:
  port: 8083

spring:
  application:
    name: transportation
  # The same database as the modulith (decision 3): this service migrates and uses only the
  # transportation area's tables. From the IDE, the cluster's PostgreSQL on NodePort 5432; in the cluster
  # the chart sets LOGISTICS_DB_* from the postgres Secret.
  datasource:
    url: ${LOGISTICS_DB_URL:jdbc:postgresql://localhost:5432/ff_logistics}
    username: ${LOGISTICS_DB_USERNAME:fflogistics}
    password: ${LOGISTICS_DB_PASSWORD:fflogisticsDb2026}
  # Kafka: where this service's events go (decision 6). In the cluster the chart sets
  # KAFKA_BOOTSTRAP_SERVERS (kafka:9092); from the IDE, the cluster's broker on localhost:9094.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    admin:
      # Topics are created at the start. Without a broker the start is held 5 s, not 40 s: the
      # service starts anyway, and the outbox sends its events once the broker is back.
      operation-timeout: 5s
      close-timeout: 2s
    producer:
      # Wait for every in-sync replica: an acknowledged event survives a broker that fails.
      acks: all
      properties:
        # Give up a send after 10 s without a broker instead of 60 s. The event stays open in
        # transportation.event_publication, and the outbox sends it again.
        max.block.ms: 10000
  modulith:
    events:
      externalization:
        # The events marked @Externalized (ShipmentDelivered, ShipmentProgressed) go to Kafka.
        enabled: ${EVENTS_EXTERNALIZATION_ENABLED:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Checked here against the identity service's keys; this process never calls Keycloak.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8085/jwks}
          issuer-uri: ${IDENTITY_TOKEN_ISSUER:http://localhost:8180/realms/ff-logistics}
          audiences: ff-logistics-api

ff:
  security:
    header-fallback:
      # Local development only, switched on by the "local" profile (application-local.yml).
      enabled: false
  # This service's outbox (ff-base-events, decision 12): the event publication registry in the
  # schema "transportation", migrated with the area.
  events:
    schema: transportation
