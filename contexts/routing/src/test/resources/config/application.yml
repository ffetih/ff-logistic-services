# Test overrides (classpath:/config/application.yml wins over the main file): an in-memory
# database, migrated by the same area migrations as PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:service;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Most tests need no broker: events stay inside the service. RouteStopEventsToKafkaTest turns
  # externalization on, with a broker in the test JVM.
  modulith:
    events:
      externalization:
        enabled: false
