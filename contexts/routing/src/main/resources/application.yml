# The chassis (ff-base-app) brings the shared defaults: health groups, probes, virtual threads,
# schema validation. The datasource and token settings are the same in all three services and in
# the modulith: the same database, the same identity service. Repeated per service, as a service's
# configuration is its own.
server:
  port: 8084

spring:
  application:
    name: routing
  # The same database as the modulith (decision 3): this service migrates and uses only the
  # routing area's tables. From the IDE, the cluster's PostgreSQL on NodePort 5432; in the cluster
  # the chart sets LOGISTICS_DB_* from the postgres Secret.
  datasource:
    url: ${LOGISTICS_DB_URL:jdbc:postgresql://localhost:5432/ff_logistics}
    username: ${LOGISTICS_DB_USERNAME:fflogistics}
    password: ${LOGISTICS_DB_PASSWORD:fflogisticsDb2026}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Checked here against the identity service's keys; this process never calls Keycloak.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8085/jwks}
          issuer-uri: ${IDENTITY_TOKEN_ISSUER:http://localhost:8180/realms/ff-logistics}
          audiences: ff-logistics-api

ff:
  security:
    header-fallback:
      # Local development only, switched on by the "local" profile (application-local.yml).
      enabled: false
  # The routing area's planner. Road distances come from the straight-line estimate (haversine x
  # 1.24) unless ROUTING_ROAD_MATRIX=osrm and an OSRM server is named; the cluster runs none. Longer
  # routes, and any with a time window, are ordered by Timefold within the solver limits.
  routing:
    road-matrix: ${ROUTING_ROAD_MATRIX:haversine}
    osrm:
      base-url: ${ROUTING_OSRM_URL:http://localhost:5000}
    max-stops: 99
    nearest-neighbour-max-stops: 8
    solver-limit: PT1S
    solver-unimproved-limit: PT0.2S
